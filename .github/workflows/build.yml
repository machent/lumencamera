name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install application and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good v4l-utils xvfb dpkg
      - name: Check syntax and configuration logic
        run: |
          /usr/bin/python3 -m py_compile app.py core.py easter_egg.py packaging/build_packages.py
          /usr/bin/python3 -m unittest discover -s tests -v
          bash -n install.sh launcher.sh packaging/lumencamera
      - name: Exercise camera and recording with synthetic devices
        run: xvfb-run -a /usr/bin/python3 tests/smoke.py
      - name: Exercise the optional Settings easter egg with a fake game
        run: xvfb-run -a /usr/bin/python3 tests/smoke_easter_egg.py
      - uses: actions/upload-artifact@v4
        with:
          name: settings-preview
          path: ../lumen-easter-egg-preview.png
          if-no-files-found: error
      - name: Build Debian package and source archive
        run: |
          python3 packaging/build_packages.py deb
          python3 packaging/build_packages.py source
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-and-source
          path: dist/*
          if-no-files-found: error

  fedora:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build RPM in Fedora
        run: |
          docker run --rm -v "$PWD:/source" -w /source fedora:latest bash -euc '
            dnf install -y rpm-build python3 tar gzip
            python3 packaging/build_packages.py rpm
            rpm -qp --info dist/*.noarch.rpm
            rpm -qp --requires dist/*.noarch.rpm
          '
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-and-srpm
          path: dist/*.rpm
          if-no-files-found: error
