name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install application and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good v4l-utils xvfb dpkg pulseaudio pulseaudio-utils weston x11-utils
      - name: Check syntax and configuration logic
        run: |
          /usr/bin/python3 -m py_compile app.py core.py easter_egg.py video_easter.py virtual_camera.py packaging/build_packages.py
          /usr/bin/python3 -m unittest discover -s tests -v
          bash -n install.sh launcher.sh packaging/lumencamera
      - name: Exercise camera and recording with synthetic devices
        run: xvfb-run -a /usr/bin/python3 tests/smoke.py
      - name: Discover and select inputs on a temporary audio server
        run: /usr/bin/python3 tests/smoke_microphones.py
      - name: Check native X11, window icon and hidden Settings easter egg
        run: env XDG_SESSION_TYPE=x11 GDK_BACKEND=wayland xvfb-run -a /usr/bin/python3 tests/smoke_easter_egg.py x11
      - name: Check native Wayland, desktop identity and animated Settings easter egg
        run: /usr/bin/python3 tests/run_wayland.py
      - name: Check video completion, emergency shortcut and failed playback
        run: xvfb-run -a /usr/bin/python3 tests/smoke_easter_video.py
      - name: Exercise virtual camera output and concurrent recording
        run: xvfb-run -a /usr/bin/python3 tests/smoke_virtual_camera.py
      - name: Exercise Camera Defaults confirmation and driver responses
        run: xvfb-run -a /usr/bin/python3 tests/smoke_defaults.py
      - uses: actions/upload-artifact@v4
        with:
          name: settings-preview
          path: |
            ${{ runner.temp }}/lumen-easter-egg-preview.png
            ${{ runner.temp }}/lumen-hijack-warning-preview.png
            ${{ runner.temp }}/lumen-easter-video-preview.png
            ${{ runner.temp }}/lumen-recording-preview.png
            ${{ runner.temp }}/lumen-virtual-camera-preview.png
          if-no-files-found: error
      - name: Build Debian package and source archive
        run: |
          python3 packaging/build_packages.py deb
          python3 packaging/build_packages.py source
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          test "$(dpkg-deb -f dist/*.deb Version)" = "$(python3 -c 'from core import VERSION; print(VERSION)')-1"
          dpkg-deb --extract dist/*.deb "$RUNNER_TEMP/lumen-deb-extracted"
          python3 tests/verify_bundle.py "$RUNNER_TEMP/lumen-deb-extracted"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-and-source
          path: dist/*
          if-no-files-found: error

  fedora:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build RPM in Fedora
        run: |
          docker run --rm -v "$PWD:/source" -w /source fedora:latest bash -euc '
            dnf install -y rpm-build python3 tar gzip cpio
            python3 packaging/build_packages.py rpm
            rpm -qp --info dist/*.x86_64.rpm
            rpm -qp --requires dist/*.x86_64.rpm
            test "$(rpm -qp --queryformat '%{VERSION}' dist/*.x86_64.rpm)" = "$(python3 -c "from core import VERSION; print(VERSION)")"
            mkdir -p /tmp/lumen-rpm-extracted
            rpm2cpio dist/*.x86_64.rpm | (cd /tmp/lumen-rpm-extracted && cpio -idm --quiet)
            python3 tests/verify_bundle.py /tmp/lumen-rpm-extracted
          '
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-and-srpm
          path: dist/*.rpm
          if-no-files-found: error

  release:
    needs: [ubuntu, fedora]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Release v1.2'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-1.2
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb-and-source
          path: artifacts/debian
      - uses: actions/download-artifact@v4
        with:
          name: rpm-and-srpm
          path: artifacts/fedora
      - name: Prepare verified package assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir packages
          shopt -s nullglob
          deb=(artifacts/debian/*.deb)
          rpm=(artifacts/fedora/*.x86_64.rpm)
          test "${#deb[@]}" -eq 1
          test "${#rpm[@]}" -eq 1
          test "$(dpkg-deb -f "${deb[0]}" Package)" = lumencamera
          test "$(dpkg-deb -f "${deb[0]}" Version)" = 1.2-1
          test "$(dpkg-deb -f "${deb[0]}" Architecture)" = amd64
          cp "${deb[0]}" "${rpm[0]}" packages/
          (cd packages && sha256sum *.deb *.rpm > SHA256SUMS)
      - name: Prepare release notes
        shell: bash
        run: |
          cat > release-notes.md <<'NOTES'
          LumenCamera v1.2 for Fedora and Ubuntu, with all current features and bundled easter-egg assets.

          - Start/stop a virtual camera beside Record video to share the live preview in Discord and other camera apps, while adjusting camera controls or recording.
          - Camera apps see the virtual camera as LumenCamera. When an OBS device already exists, create a separate named device without changing OBS. Initial setup can request administrator authorization. Creating a separate device requires v4l2loopback and its utility version 0.13 or newer; on older Ubuntu packages, start LumenCamera after a reboot before OBS loads the module.
          - Reliable YUY2 virtual-camera output at 30 fps, preview mirroring, stable output during camera changes, and terminal diagnostics.
          - Record Matroska (.mkv) video with an optional, selectable microphone.
          - Camera Defaults with confirmation, configurable filenames/folders, PNG/JPEG photos, and supported focus, autofocus, sharpness, exposure and other controls.
          - Native X11/Wayland selection and corrected window identity/icon.
          - Bundled HIJACK-FEDORA.run, HIJACK-UBUNTU.run and video. The animated Settings easter egg appears only on compatible KDE Plasma 6 Wayland sessions on Fedora/Ubuntu-based systems, with a 20% chance.

          **HIJACK warning:** The easter egg launches an interactive game that can reboot your computer, contains flashing visuals and may play loud audio. Save your work before choosing Yes in its confirmation window. HIJACK starts at video position 0:09.50; the video closes at 0:10.90. Right Ctrl + Escape cancels the video and a pending launch before 0:09.50. Once launched, HIJACK runs separately and closing LumenCamera does not stop it.

          The complete packages target x86-64 (amd64), matching the bundled HIJACK executables.

          **Ubuntu / Debian:** download the .deb and run:
          ```bash
          sudo apt install ./lumencamera_1.2-1_amd64.deb
          ```

          **Fedora:** enable RPM Fusion Free (https://rpmfusion.org/Configuration), download the .x86_64.rpm and run:
          ```bash
          sudo dnf install ./lumencamera-1.2-1*.x86_64.rpm
          ```

          Launch Lumen Camera from the application menu or run lumencamera.

          The native packages declare the virtual-camera dependencies: v4l2loopback-dkms, v4l2loopback-utils and pkexec on Ubuntu; akmod-v4l2loopback, v4l2loopback and polkit on Fedora. The kernel module must be built and loadable for your running kernel. OBS is not required.

          SHA256SUMS covers both packages. Full runtime and bundled-asset hashes/executable permissions are checked after package extraction; webcam/UI/recording/virtual-camera tests and Fedora/Ubuntu package builds pass before publication. Hardware camera controls depend on your device.

          Signed APT/DNF repositories are updated after successful publication.
          NOTES
      - name: Verify or create the release tag
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2 --json isDraft > existing.json 2>/dev/null; then
            jq -e '.isDraft == true' existing.json
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v1.2" > tag.json 2>/dev/null; then
            jq -e --arg sha "$RELEASE_COMMIT" '.object.sha == $sha' tag.json
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/v1.2 -f sha="$RELEASE_COMMIT"
          fi
      - name: Publish v1.2
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2 --json isDraft > existing.json 2>/dev/null; then
            jq -e '.isDraft == true' existing.json
            test "$(gh api "repos/$GH_REPO/git/ref/tags/v1.2" --jq .object.sha)" = "$RELEASE_COMMIT"
            gh release upload v1.2 packages/* --clobber
            gh release edit v1.2 --target "$RELEASE_COMMIT" --title v1.2 --notes-file release-notes.md
          else
            gh release create v1.2 packages/* --target "$RELEASE_COMMIT" --title v1.2 --notes-file release-notes.md --draft
          fi
          gh release view v1.2 --json assets > release.json
          jq -e '.assets | length == 3 and all(.[]; .size > 0)' release.json
          test "$(gh api "repos/$GH_REPO/git/ref/tags/v1.2" --jq .object.sha)" = "$RELEASE_COMMIT"
          gh release edit v1.2 --draft=false --latest
