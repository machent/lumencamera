name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install application and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi python3-gi-cairo gir1.2-gtk-3.0 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good v4l-utils xvfb dpkg pulseaudio pulseaudio-utils weston x11-utils
      - name: Check syntax and configuration logic
        run: |
          /usr/bin/python3 -m py_compile app.py core.py easter_egg.py video_easter.py virtual_camera.py packaging/build_packages.py
          /usr/bin/python3 -m unittest discover -s tests -v
          bash -n install.sh launcher.sh packaging/lumencamera
      - name: Exercise camera and recording with synthetic devices
        run: xvfb-run -a /usr/bin/python3 tests/smoke.py
      - name: Discover and select inputs on a temporary audio server
        run: /usr/bin/python3 tests/smoke_microphones.py
      - name: Check native X11, window icon and hidden Settings easter egg
        run: env XDG_SESSION_TYPE=x11 GDK_BACKEND=wayland xvfb-run -a /usr/bin/python3 tests/smoke_easter_egg.py x11
      - name: Check native Wayland, desktop identity and animated Settings easter egg
        run: /usr/bin/python3 tests/run_wayland.py
      - name: Check video completion, emergency shortcut and failed playback
        run: xvfb-run -a /usr/bin/python3 tests/smoke_easter_video.py
      - name: Exercise virtual camera output and concurrent recording
        run: xvfb-run -a /usr/bin/python3 tests/smoke_virtual_camera.py
      - name: Exercise Camera Defaults confirmation and driver responses
        run: xvfb-run -a /usr/bin/python3 tests/smoke_defaults.py
      - uses: actions/upload-artifact@v4
        with:
          name: settings-preview
          path: |
            ${{ runner.temp }}/lumen-easter-egg-preview.png
            ${{ runner.temp }}/lumen-hijack-warning-preview.png
            ${{ runner.temp }}/lumen-easter-video-preview.png
            ${{ runner.temp }}/lumen-recording-preview.png
            ${{ runner.temp }}/lumen-virtual-camera-preview.png
          if-no-files-found: error
      - name: Build Debian package and source archive
        run: |
          # Package validation uses the camera and fake-game tests only.
          mkdir -p "$RUNNER_TEMP/lumen-game-files"
          for game in easter-eggs/*.run; do
            [ ! -f "$game" ] || mv "$game" "$RUNNER_TEMP/lumen-game-files/"
          done
          python3 packaging/build_packages.py deb
          python3 packaging/build_packages.py source
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: deb-and-source
          path: dist/*
          if-no-files-found: error

  fedora:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build RPM in Fedora
        run: |
          mkdir -p "$RUNNER_TEMP/lumen-game-files"
          for game in easter-eggs/*.run; do
            [ ! -f "$game" ] || mv "$game" "$RUNNER_TEMP/lumen-game-files/"
          done
          docker run --rm -v "$PWD:/source" -w /source fedora:latest bash -euc '
            dnf install -y rpm-build python3 tar gzip
            python3 packaging/build_packages.py rpm
            rpm -qp --info dist/*.noarch.rpm
            rpm -qp --requires dist/*.noarch.rpm
          '
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-and-srpm
          path: dist/*.rpm
          if-no-files-found: error
